<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Jot it down. Find it fast.</p>
  </header>

  <main>
    <section class="add-section">
      <h2>Add a note</h2>
      <form id="note-form">
        <label for="note-input">Note</label>
        <input type="text" id="note-input" placeholder="Type your note here">
        <select id="note-category" aria-label="Category">
          <option value="personal">Personal</option>
          <option value="work">Work</option>
          <option value="study">Study</option>
        </select>
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message" role="alert"></p>
    </section>

    <section class="notes-section">
      <h2>Your notes</h2>
      <label for="search-input" class="visually-hidden">Search notes</label>
      <input type="search" id="search-input" placeholder="Search notes...">
      <p id="note-count"></p>
      <ul id="notes-list"></ul>
      <button type="button" id="clear-all-btn">Clear all</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes</p>
  </footer>
  <script src="script.js" defer></script>
</body>
</html>
